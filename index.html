<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baxter Solutions</title>
<meta name="description" content="Baxter Solutions — workflow systems for small businesses and independent practices.">
<link rel="canonical" href="https://baxter.solutions/">

<!-- Open Graph -->
<meta property="og:title" content="Baxter Solutions">
<meta property="og:description" content="Workflow systems for small businesses and independent practices.">
<meta property="og:url" content="https://baxter.solutions/">
<meta property="og:type" content="website">

<style>
  :root {
    --bg: #fbfbfa;
    --fg: #1c1b19;
    --muted: #5a5850;
    --rule: #d8d6cf;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513;
      --fg: #f2f1ec;
      --muted: #b3b0a5;
      --rule: #3a3833;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Georgia, Cambria, "Times New Roman", Times, serif;
    font-size: 1.0625rem;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main {
    max-width: 34rem;
    margin: 0 auto;
    padding: 22vh 1.5rem 12vh;
  }

  @media (max-width: 480px) {
    main {
      padding: 16vh 1.25rem 10vh;
    }
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 400;
    letter-spacing: 0.02em;
    margin: 0 0 2rem;
  }

  p {
    margin: 0 0 1.25rem;
    color: var(--fg);
  }

  p.lede {
    color: var(--muted);
  }

  .rule {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 2.5rem 0;
    width: 2.5rem;
  }

  a {
    color: var(--fg);
    text-decoration: underline;
    text-decoration-color: var(--rule);
    text-underline-offset: 3px;
  }

  a:hover,
  a:focus {
    text-decoration-color: var(--fg);
  }

  .meta {
    color: var(--muted);
    font-size: 0.9375rem;
    margin: 0;
  }
</style>
</head>
<body>

<main>
  <h1>Baxter Solutions</h1>

  <p class="lede">Workflow systems for small businesses and independent practices — designed, built, and handed over.</p>

  <hr class="rule">

  <p><a href="mailto:ethan@baxter.solutions">ethan@baxter.solutions</a></p>
  <p class="meta">Ethan Cota · San Diego, California</p>
</main>

</body>
</html>
